name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "csharp/**"
      - "assets/**"
      - "scenes/**"
      - "project.godot"
      - "export_presets.cfg"
      - "OperationSteelTide.csproj"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Set up Godot 4.6.3 Mono and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.6.3"
          use-dotnet: true
          include-templates: true

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Verify toolchain
        run: |
          godot --version
          dotnet --version
          java -version

      - name: Import project and compile C#
        run: |
          godot --headless --editor --path . --import
          godot --headless --editor --path . --build-solutions --quit

      - name: Install Android Gradle build template
        run: godot --headless --editor --path . --install-android-build-template --quit

      - name: Export debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/OperationSteelTide-debug.apk

      - name: Verify APK
        run: |
          test -s build/android/OperationSteelTide-debug.apk
          ls -lh build/android/OperationSteelTide-debug.apk
          file build/android/OperationSteelTide-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OperationSteelTide-Android-ARM64
          path: build/android/OperationSteelTide-debug.apk
          if-no-files-found: error
          retention-days: 14
